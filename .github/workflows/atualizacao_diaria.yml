name: Atualizar Banco de Dados Diariamente

on:
  schedule:
    # Roda todo dia às 03:00 da manhã (horário UTC, que é meia-noite no Brasil)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo site do GitHub se precisar

jobs:
  atualizar_banco:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # ou a versão que você está usando

      - name: Instalar bibliotecas
        run: |
          pip install pandas requests sqlalchemy psycopg2-binary

      - name: Rodar o script de importação
        run: python importar_dados.py